name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          export PUBLIC_URL=http://localhost:8080
          export NGINX_PORT=8080
          docker compose build
          docker compose up -d
          # Wait for web to be ready
          sleep 10
          docker compose exec -T web /usr/local/bin/python3 manage.py test ide.tests.test_alloy_templates ide.tests.test_c_templates ide.tests.test_find_project_root ide.tests.test_git ide.tests.test_github_repo_sync
        timeout-minutes: 30