# Build the cloudpebble emulator backend images and publish to GHCR, so they can
# run on the pebble-cluster (k8s) instead of only via local docker-compose on the
# Hetzner box. The qemu image compiles QEMU from source (coredevices/qemu) — slow.
# Manual trigger + on changes to the two build contexts.
name: build-cluster-images

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "Pebble SDK version"
        default: "4.33.1"
  push:
    branches: [main, master, cluster-images]
    paths:
      - "cloudpebble-qemu-controller/**"
      - "cloudpebble-ycmd-proxy/**"
      - ".github/workflows/build-cluster-images.yml"

concurrency:
  group: build-cluster-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SDK_VERSION: ${{ github.event.inputs.sdk_version || '4.33.1' }}
  NODE_VERSION_YCMD: "16.20.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: qemu
            context: cloudpebble-qemu-controller
            build_args: |
              PEBBLE_SDK_VERSION=4.33.1
          - name: ycmd
            context: cloudpebble-ycmd-proxy
            build_args: |
              PEBBLE_SDK_VERSION=4.33.1
              NODE_VERSION=16.20.2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/coredevices/cloudpebble-${{ matrix.name }}:${{ env.SDK_VERSION }}
            ghcr.io/coredevices/cloudpebble-${{ matrix.name }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
