events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Use Docker's DNS resolver - allows runtime resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Qemu
        location /qemu {
            proxy_pass http://qemu:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # YCMD
        location /ycmd/ {
            proxy_pass http://ycmd:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # This box only serves the emulator + code completion backends.
        # The CloudPebble web app lives at cloudpebble.repebble.com.
        location / {
            default_type text/plain;
            return 200 "CloudPebble emulator backend. The IDE is at https://cloudpebble.repebble.com\n";
        }
    }

    server {
        listen 80;
        server_name ci.repebble.com;

        location / {
            proxy_pass http://host.docker.internal:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
