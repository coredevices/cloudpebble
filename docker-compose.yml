name: cloudpebble

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - qemu
      - ycmd

  web:
    build:
      context: cloudpebble/
      args:
        PEBBLE_SDK_VERSION: ${PEBBLE_SDK_VERSION}
        NODE_VERSION: ${NODE_VERSION_WEB:-20.11.0}
    env_file:
      - path: .env.local
        required: false
    links:
      - redis
      - postgres
      - s3
      - qemu
      - ycmd
    volumes:
      - secret-key-data:/data
    environment:
      - DEBUG=yes
      - RUN_WEB=yes
      - RUN_MIGRATE=yes
      - AWS_ENABLED=yes
      - PORT=80
      - AWS_S3_FAKE_S3=${AWS_S3_FAKE_S3-s3:4569}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_SOURCE_BUCKET=${AWS_S3_SOURCE_BUCKET:-source.cloudpebble.net}
      - AWS_S3_BUILDS_BUCKET=${AWS_S3_BUILDS_BUCKET:-builds.cloudpebble.net}
      - AWS_S3_EXPORT_BUCKET=${AWS_S3_EXPORT_BUCKET:-export.cloudpebble.net}
      - MEDIA_URL=${PUBLIC_URL}/s3builds/
      - QEMU_URLS=http://qemu/
      - QEMU_PUBLIC_URL=${PUBLIC_URL}
      - YCM_URLS=http://ycmd:80/
      - YCMD_PUBLIC_URL=${YCMD_PUBLIC_URL:-}
      - PUBLIC_URL=${PUBLIC_URL}/
      - EXPECT_SSL=${EXPECT_SSL:-no}
      - LIBPEBBLE_PROXY=${LIBPEBBLE_PROXY:-wss://cloudpebble-proxy.repebble.com/tool}
      - CLOUDPEBBLE_PROXY=${CLOUDPEBBLE_PROXY:-wss://cloudpebble-proxy.repebble.com/tool}
      - PEBBLE_AUTH_URL=${PEBBLE_AUTH_URL:-https://auth.rebble.io}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-coreapp-ce061}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - AGENT_URL=${AGENT_URL:-}
      - AGENT_AUTH_HEADER=${AGENT_AUTH_HEADER:-}
      - AGENT_ENABLED_USERS=${AGENT_ENABLED_USERS:-}
      - AGENT_MAX_TURNS_PER_DAY=${AGENT_MAX_TURNS_PER_DAY:-50}
      - AGENT_FREE_MODEL=${AGENT_FREE_MODEL:-}
      - AGENT_FREE_API_BASE=${AGENT_FREE_API_BASE:-}
      - AGENT_FREE_API_KEY=${AGENT_FREE_API_KEY:-}
      - AGENT_VISION_API_BASE=${AGENT_VISION_API_BASE:-}
      - AGENT_VISION_API_KEY=${AGENT_VISION_API_KEY:-}
      - AGENT_VISION_MODEL=${AGENT_VISION_MODEL:-}
      - AGENT_ANTHROPIC_OAUTH_CLIENT_ID=${AGENT_ANTHROPIC_OAUTH_CLIENT_ID:-}

  celery:
    build:
      context: cloudpebble/
      args:
        PEBBLE_SDK_VERSION: ${PEBBLE_SDK_VERSION}
        NODE_VERSION: ${NODE_VERSION_WEB:-20.11.0}
    env_file:
      - path: .env.local
        required: false
    links:
      - redis
      - postgres
      - s3
    volumes:
      - secret-key-data:/data
    environment:
      - DEBUG=yes
      - RUN_CELERY=yes
      - AWS_ENABLED=yes
      - EXPORT_ROOT=http://web:80/export.cloudpebble.net/
      - AWS_S3_FAKE_S3=${AWS_S3_FAKE_S3-s3:4569}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_SOURCE_BUCKET=${AWS_S3_SOURCE_BUCKET:-source.cloudpebble.net}
      - AWS_S3_BUILDS_BUCKET=${AWS_S3_BUILDS_BUCKET:-builds.cloudpebble.net}
      - AWS_S3_EXPORT_BUCKET=${AWS_S3_EXPORT_BUCKET:-export.cloudpebble.net}
      - MEDIA_URL=${PUBLIC_URL:-http://nginx}/s3builds/
      - PUBLIC_URL=${PUBLIC_URL}/
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}

  qemu:
    build:
      context: cloudpebble-qemu-controller/
      args:
        PEBBLE_SDK_VERSION: ${PEBBLE_SDK_VERSION}
    restart: unless-stopped
    environment:
      - EMULATOR_FIXED_LIMIT=${EMULATOR_FIXED_LIMIT:-90}

  ycmd:
    build:
      context: cloudpebble-ycmd-proxy/
      args:
        PEBBLE_SDK_VERSION: ${PEBBLE_SDK_VERSION}
        NODE_VERSION: ${NODE_VERSION_YCMD:-16.20.2}

  redis:
    image: ${REDIS_IMAGE:-redis:7}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3:
    image: kuracloud/fake-s3
    ports:
      - "8003:4569"
    volumes:
      - s3-data:/fakes3_root

volumes:
  postgres-data:
  s3-data:
  secret-key-data:
